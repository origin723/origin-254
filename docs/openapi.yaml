      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: verification_status
        schema:
          type: string
          enum:
          - approved
          - pending
          - rejected
          - suspended
        description: |-
          * `pending` - Pending review
          * `approved` - Approved
          * `rejected` - Rejected
          * `suspended` - Suspended
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
