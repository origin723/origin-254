openapi: 3.0.3
info:
  title: Origin 254 API
  version: 1.0.0
  description: Agricultural sourcing and value-addition marketplace API (Kenya).
paths:
  /api/v1/admin/analytics/:
    get:
      operationId: v1_admin_analytics_retrieve
      description: 'Platform KPIs: users, sourcing, matching performance, orders and
        delivery.'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Limit to the last N days
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/audit-logs/:
    get:
      operationId: v1_admin_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/audit-logs/{id}/:
    get:
      operationId: v1_admin_audit_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/admin/buyers/:
    get:
      operationId: v1_admin_buyers_list
      parameters:
