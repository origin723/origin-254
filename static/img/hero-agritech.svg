<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Connected Kenyan agriculture</title>
  <desc id="d">Farms monitored by drones and sensors, a phone showing market prices and M-Pesa payments, a truck carrying mango crates to a processor, and a digital network linking farmers, buyers and markets.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeeff"/><stop offset=".55" stop-color="#eaf8ff"/><stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe680"/><stop offset=".45" stop-color="#ffd23f" stop-opacity=".9"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9edb7f"/><stop offset="1" stop-color="#6cc36a"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fcf6e"/><stop offset="1" stop-color="#46ad5a"/></linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fbf63"/><stop offset="1" stop-color="#2f9e4f"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d3a8"/><stop offset="1" stop-color="#d9b97f"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef8ea"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f7ff" stop-opacity=".95"/><stop offset="1" stop-color="#bfe6f7" stop-opacity=".9"/></linearGradient>
    <pattern id="rows" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="26" height="26" fill="none"/><path d="M0 13h26" stroke="#3a9a4c" stroke-width="5" stroke-linecap="round" opacity=".35"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2f9e4f" flood-opacity=".18"/></filter>
  </defs>

  <!-- Sky and sun -->
  <rect width="1600" height="760" fill="url(#sky)"/>
  <circle cx="1530" cy="70" r="150" fill="url(#sunGlow)"/>
  <circle cx="1530" cy="70" r="52" fill="#ffd23f"/>
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="980" cy="110" rx="80" ry="22"/><ellipse cx="1030" cy="96" rx="52" ry="24"/>
    <ellipse cx="820" cy="90" rx="70" ry="18"/><ellipse cx="860" cy="78" rx="44" ry="20"/>
  </g>

  <!-- Digital marketplace network in the sky -->
  <g stroke="#3aa7e8" stroke-width="2.5" stroke-dasharray="6 7" fill="none" opacity=".75">
    <path d="M1060 170 C 1120 120, 1180 120, 1240 140"/>
    <path d="M1240 140 C 1320 150, 1400 160, 1470 190"/>
    <path d="M1060 170 C 1120 250, 1220 290, 1330 300"/>
    <path d="M1470 190 C 1480 250, 1420 290, 1330 300"/>
  </g>
  <g filter="url(#soft)">
    <!-- farmer node -->
    <circle cx="1060" cy="170" r="30" fill="#ffffff" stroke="#2f9e4f" stroke-width="4"/>
    <path d="M1048 178 q12 -26 24 0 z" fill="#2f9e4f"/><circle cx="1060" cy="159" r="7" fill="#2f9e4f"/>
    <!-- market node -->
    <circle cx="1240" cy="140" r="30" fill="#ffffff" stroke="#ff9a1f" stroke-width="4"/>
    <path d="M1223 136 h34 l-4 -12 h-26 z" fill="#ff9a1f"/><rect x="1226" y="136" width="28" height="16" rx="2" fill="#ffb84d"/>
    <!-- processor node -->
    <circle cx="1470" cy="190" r="30" fill="#ffffff" stroke="#e8527a" stroke-width="4"/>
    <rect x="1458" y="178" width="10" height="24" rx="2" fill="#e8527a"/><rect x="1472" y="186" width="10" height="16" rx="2" fill="#f58aa5"/>
    <!-- payment node -->
    <circle cx="1330" cy="300" r="28" fill="#ffffff" stroke="#3aa7e8" stroke-width="4"/>
    <text x="1330" y="307" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1f72c4" text-anchor="middle">KES</text>
  </g>

  <!-- Hills -->
  <path d="M0 470 C 220 400, 420 430, 640 420 C 900 405, 1100 360, 1350 390 C 1460 402, 1540 395, 1600 385 V760 H0 Z" fill="url(#hill1)"/>
  <path d="M0 540 C 260 470, 520 520, 760 500 C 1020 478, 1240 450, 1600 480 V760 H0 Z" fill="url(#hill2)"/>
  <path d="M0 540 C 260 470, 520 520, 760 500 C 1020 478, 1240 450, 1600 480 V760 H0 Z" fill="url(#rows)"/>

  <!-- Greenhouse with solar -->
  <g transform="translate(1290 390) scale(.85)" filter="url(#soft)">
    <path d="M0 80 V40 Q70 -10 140 40 V80 Z" fill="url(#glass)" stroke="#7cc2df" stroke-width="3"/>
    <path d="M35 80 V18 M70 80 V8 M105 80 V18" stroke="#9fd3e8" stroke-width="2"/>
    <rect x="-70" y="40" width="58" height="34" rx="3" fill="#1f72c4" transform="skewX(-12)"/>
    <path d="M-62 57 h46 M-56 46 v26 M-40 46 v26 M-24 46 v26" stroke="#7fc1f5" stroke-width="2" transform="skewX(-12)"/>
    <rect x="-46" y="74" width="4" height="10" fill="#5d6e5a"/>
  </g>

  <!-- Mango trees -->
  <g>
  <g transform="translate(110 20)">
    <rect x="1010" y="420" width="12" height="46" rx="4" fill="#8a5a2b"/>
    <circle cx="1016" cy="405" r="40" fill="#2f9e4f"/><circle cx="992" cy="420" r="26" fill="#3fb25c"/><circle cx="1042" cy="418" r="26" fill="#3fb25c"/>
    <circle cx="998" cy="400" r="7" fill="#ff9a1f"/><circle cx="1030" cy="410" r="7" fill="#ffb84d"/><circle cx="1012" cy="428" r="7" fill="#ff9a1f"/>
    <rect x="1120" y="405" width="10" height="40" rx="4" fill="#8a5a2b"/>
    <circle cx="1125" cy="392" r="33" fill="#2f9e4f"/><circle cx="1105" cy="404" r="20" fill="#3fb25c"/>
    <circle cx="1115" cy="385" r="6" fill="#ffb84d"/><circle cx="1138" cy="398" r="6" fill="#ff9a1f"/>
  </g>
  </g>

  <!-- Field sensor posts -->
  <g>
    <rect x="1380" y="470" width="5" height="44" fill="#5d6e5a"/><rect x="1370" y="458" width="25" height="16" rx="4" fill="#ffffff" stroke="#3aa7e8" stroke-width="2"/>
    <circle cx="1382" cy="466" r="3" fill="#2f9e4f"/>
    <path d="M1398 452 a14 14 0 0 1 0 -20 M1404 458 a24 24 0 0 0 0 -32" stroke="#3aa7e8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="1060" y="500" width="5" height="40" fill="#5d6e5a"/><rect x="1050" y="488" width="25" height="16" rx="4" fill="#ffffff" stroke="#3aa7e8" stroke-width="2"/>
    <circle cx="1062" cy="496" r="3" fill="#2f9e4f"/>
  </g>

  <!-- Drone over the field -->
  <g transform="translate(1160 290)" filter="url(#soft)">
    <rect x="-30" y="-6" width="60" height="16" rx="8" fill="#ffffff" stroke="#2b3b29" stroke-width="3"/>
    <path d="M-30 0 H-62 M30 0 H62" stroke="#2b3b29" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-62" cy="-6" rx="24" ry="5" fill="#2b3b29" opacity=".75"/><ellipse cx="62" cy="-6" rx="24" ry="5" fill="#2b3b29" opacity=".75"/>
    <circle cx="0" cy="12" r="6" fill="#3aa7e8"/>
    <path d="M-34 24 L-80 150 H80 L34 24 Z" fill="#3aa7e8" opacity=".14"/>
  </g>

  <!-- Front hill and road -->
  <path d="M0 610 C 300 560, 640 600, 900 585 C 1180 570, 1380 560, 1600 575 V760 H0 Z" fill="url(#hill3)"/>
  <path d="M520 760 C 700 690, 980 640, 1600 628 V672 C 1060 684, 820 720, 700 760 Z" fill="url(#road)"/>
  <path d="M760 742 C 900 700, 1100 668, 1600 650" stroke="#ffffff" stroke-width="4" stroke-dasharray="26 22" fill="none" opacity=".8"/>

  <!-- Truck carrying mango crates -->
  <g transform="translate(1150 598)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="66" rx="8" fill="#ffffff" stroke="#2f9e4f" stroke-width="3"/>
    <g fill="#ff9a1f"><rect x="12" y="10" width="38" height="22" rx="3"/><rect x="56" y="10" width="38" height="22" rx="3"/><rect x="100" y="10" width="38" height="22" rx="3"/>
      <rect x="34" y="36" width="38" height="22" rx="3" fill="#ffb84d"/><rect x="78" y="36" width="38" height="22" rx="3" fill="#ffb84d"/></g>
    <path d="M150 16 H192 L214 42 V66 H150 Z" fill="#2f9e4f"/>
    <path d="M160 24 H188 L203 42 H160 Z" fill="#d9f2ff"/>
    <circle cx="40" cy="70" r="14" fill="#2b3b29"/><circle cx="40" cy="70" r="6" fill="#d9ecd2"/>
    <circle cx="180" cy="70" r="14" fill="#2b3b29"/><circle cx="180" cy="70" r="6" fill="#d9ecd2"/>
    <text x="75" y="-8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f7a3a" text-anchor="middle">1,500 kg → Nairobi</text>
  </g>

  <!-- Processor / jam factory -->
  <g transform="translate(1400 470)" filter="url(#soft)">
    <rect x="0" y="40" width="170" height="110" rx="6" fill="#ffffff" stroke="#e8527a" stroke-width="3"/>
    <path d="M0 40 L40 10 L40 40 L80 10 L80 40 L120 10 L120 40 L170 40" fill="#ffe3ea" stroke="#e8527a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="135" y="-20" width="16" height="60" fill="#e8527a"/>
    <g fill="#ff9a1f"><rect x="18" y="98" width="26" height="34" rx="5"/><rect x="54" y="98" width="26" height="34" rx="5"/><rect x="90" y="98" width="26" height="34" rx="5"/></g>
    <g fill="#e8527a"><rect x="16" y="92" width="30" height="8" rx="2"/><rect x="52" y="92" width="30" height="8" rx="2"/><rect x="88" y="92" width="30" height="8" rx="2"/></g>
    <rect x="126" y="96" width="30" height="54" rx="3" fill="#ffd23f"/>
  </g>

  <!-- Smartphone: market prices + M-Pesa -->
  <g transform="translate(880 235) rotate(-6) scale(.9)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="270" rx="24" fill="#1e2b1d"/>
    <rect x="9" y="16" width="132" height="238" rx="16" fill="url(#phone)"/>
    <text x="22" y="46" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#1f7a3a">Mango demand</text>
    <polyline points="22,120 44,108 64,112 84,90 104,96 126,66" fill="none" stroke="#2f9e4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="126" cy="66" r="5" fill="#ff9a1f"/>
    <g fill="#d9ecd2"><rect x="22" y="128" width="16" height="22" rx="3"/><rect x="44" y="120" width="16" height="30" rx="3"/><rect x="66" y="112" width="16" height="38" rx="3"/><rect x="88" y="104" width="16" height="46" rx="3"/><rect x="110" y="94" width="16" height="56" rx="3"/></g>
    <rect x="20" y="164" width="110" height="34" rx="10" fill="#2f9e4f"/>
    <text x="75" y="186" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">KES 47 / kg ↑</text>
    <rect x="20" y="206" width="110" height="34" rx="10" fill="#ff9a1f"/>
    <text x="75" y="228" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#3a2300" text-anchor="middle">Pay · M-Pesa ✓</text>
  </g>

  <!-- Market stall -->
  <g transform="translate(905 545) scale(.85)" filter="url(#soft)">
    <rect x="0" y="40" width="150" height="70" rx="6" fill="#ffffff" stroke="#ff9a1f" stroke-width="3"/>
    <path d="M-10 40 H160 L150 0 H0 Z" fill="#ff9a1f"/>
    <path d="M0 0 L-10 40 M30 0 L25 40 M60 0 L60 40 M90 0 L95 40 M120 0 L130 40" stroke="#ffffff" stroke-width="5"/>
    <g><circle cx="30" cy="70" r="12" fill="#ff9a1f"/><circle cx="52" cy="72" r="12" fill="#ffb84d"/><circle cx="74" cy="70" r="12" fill="#ff9a1f"/>
      <ellipse cx="108" cy="72" rx="16" ry="11" fill="#2f9e4f"/><ellipse cx="130" cy="74" rx="12" ry="9" fill="#46b866"/></g>
  </g>

  <!-- Farmer with crate -->
  <g transform="translate(1075 680) scale(.9)">
    <circle cx="0" cy="-58" r="13" fill="#7a4a24"/>
    <path d="M-18 -60 Q0 -84 18 -60 Z" fill="#ffd23f"/>
    <rect x="-14" y="-44" width="28" height="44" rx="10" fill="#2f9e4f"/>
    <rect x="-12" y="0" width="10" height="34" rx="4" fill="#24402a"/><rect x="2" y="0" width="10" height="34" rx="4" fill="#24402a"/>
    <rect x="14" y="-34" width="40" height="28" rx="4" fill="#ff9a1f"/>
    <path d="M14 -20 h40" stroke="#ffb84d" stroke-width="3"/>
  </g>
</svg>
